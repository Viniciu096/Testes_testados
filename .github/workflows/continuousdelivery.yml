name: Continuous Delivery
on:
  push:
    branches:
      - main

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: check out repository code
        uses: action/checkout@v4

      - name: simulando continuous delivery
           uses: actions/upload-artifact@v4
             with:
               name: projetozipado.zip
               path: |
                 Main.py
                 README.md